[roles]

[roles.planner]
prompt_file = "roles/planner.md"

[roles.builder]
prompt_file = "roles/builder.md"

[roles.critic]
prompt_file = "roles/critic.md"

[roles.finalizer]
prompt_file = "roles/finalizer.md"

[handoff]
"loop.start" = ["planner"]
"queue.advance" = ["builder"]
"build.blocked" = ["planner", "finalizer"]
"tasks.ready" = ["builder"]
"review.ready" = ["critic"]
"review.rejected" = ["builder"]
